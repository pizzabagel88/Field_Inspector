name: field_inspector
description: A camera app with GPS, compass, and annotation capabilities similar to Conota Camera.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+5
  geolocator: ^10.1.0
  sensors_plus: ^4.0.2
  permission_handler: ^11.0.1
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  intl: ^0.18.1
  image_picker: ^1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
